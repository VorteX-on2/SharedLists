syntax = "proto3";

package sharedlists.v1;

option java_multiple_files = true;
option java_package = "dev.sharedlists.protocol";
option java_outer_classname = "SharedListsProto";

service SharedLists {
  rpc GetChallenge(ChallengeRequest) returns (AuthenticationChallenge);
  rpc Sync(stream SyncRequest) returns (stream SyncResponse);
}

message ChallengeRequest {
  string key_fingerprint = 1;
}

message AuthenticationChallenge {
  bytes nonce = 1;
  int64 issued_at_epoch_seconds = 2;
  int64 expires_at_epoch_seconds = 3;
  string audience = 4;
}

message SynchronizationCursor {
  string generation = 1;
  int64 last_applied_revision = 2;
}

message OpenSync {
  optional SynchronizationCursor cursor = 1;
}

message AppliedThrough {
  int64 revision = 1;
}

message SubmitOperation {
  ClientOperation operation = 1;
}

message SyncRequest {
  oneof message {
    OpenSync open = 1;
    AppliedThrough applied_through = 2;
    SubmitOperation submit_operation = 3;
  }
}

message SharedList {
  string id = 1;
  string name = 2;
  repeated ListItem items = 3;
}

message ListItem {
  string id = 1;
  string text = 2;
  int32 position = 3;
  bool marked = 4;
}

message ListTombstone {
  string list_id = 1;
  int64 deleted_revision = 2;
}

message Snapshot {
  string generation = 1;
  int64 revision = 2;
  repeated SharedList lists = 3;
  repeated ListTombstone tombstones = 4;
}

message CreateList {
  string list_id = 1;
  string name = 2;
}

message RenameList {
  string list_id = 1;
  string name = 2;
}

message DeleteList {
  string list_id = 1;
}

message CreateItem {
  string list_id = 1;
  string item_id = 2;
  string text = 3;
}

message EditItemText {
  string list_id = 1;
  string item_id = 2;
  string text = 3;
}

message SetMarked {
  string list_id = 1;
  string item_id = 2;
  bool value = 3;
}

message DeleteItem {
  string list_id = 1;
  string item_id = 2;
}

message ClientOperation {
  string operation_id = 1;
  oneof operation {
    CreateList create_list = 2;
    RenameList rename_list = 3;
    DeleteList delete_list = 4;
    CreateItem create_item = 5;
    EditItemText edit_item_text = 6;
    DeleteItem delete_item = 7;
    SetMarked set_marked = 8;
  }
}

enum OperationOutcome {
  OPERATION_OUTCOME_UNSPECIFIED = 0;
  OPERATION_OUTCOME_APPLIED = 1;
  OPERATION_OUTCOME_IGNORED = 2;
  OPERATION_OUTCOME_REJECTED = 3;
}

message JournalEntry {
  int64 revision = 1;
  ClientOperation operation = 2;
  OperationOutcome outcome = 3;
}

message JournalBatch {
  string generation = 1;
  repeated JournalEntry entries = 2;
}

message EmptySnapshot {
  string generation = 1;
  int64 revision = 2;
}

message Live {
  string generation = 1;
  int64 revision = 2;
}

message SyncResponse {
  oneof message {
    EmptySnapshot empty_snapshot = 1;
    Live live = 2;
    Snapshot snapshot = 3;
    JournalBatch journal_batch = 4;
  }
}
